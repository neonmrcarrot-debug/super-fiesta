<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Catcher</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1020;
      --panel: #1b1d38;
      --accent: #77f2ff;
      --danger: #ff5f7e;
      --text: #eef3ff;
      --muted: #b2bdd8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at 20% 20%, #1c2254 0, var(--bg) 45%, #090b16 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .game-shell {
      width: min(94vw, 760px);
      display: grid;
      gap: 0.8rem;
    }

    .hud {
      background: linear-gradient(120deg, rgba(119, 242, 255, 0.16), rgba(255, 95, 126, 0.18));
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 0.8rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .hud strong {
      color: var(--accent);
      margin-left: 0.25rem;
    }

    .hud button {
      border: none;
      color: var(--bg);
      background: var(--accent);
      padding: 0.5rem 0.8rem;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 120ms ease;
    }

    .hud button:hover {
      transform: translateY(-1px);
    }

    canvas {
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: linear-gradient(#131634, #090b18);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
      touch-action: none;
    }

    .tip {
      color: var(--muted);
      font-size: 0.95rem;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <section class="hud">
      <div>Score<strong id="score">0</strong></div>
      <div>Lives<strong id="lives">3</strong></div>
      <div>Best<strong id="best">0</strong></div>
      <button id="restart" type="button">Restart</button>
    </section>
    <canvas id="game" width="760" height="460" aria-label="Star Catcher game"></canvas>
    <p class="tip">Move the ship with your mouse (or finger). Catch ⭐ stars, avoid ☄ meteors, survive as long as you can.</p>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const bestEl = document.getElementById("best");
    const restartBtn = document.getElementById("restart");

    const state = {
      score: 0,
      lives: 3,
      best: Number(localStorage.getItem("starCatcherBest") || 0),
      running: true,
      spawnTimer: 0,
      speed: 2.2,
      playerX: canvas.width / 2,
      stars: [],
      meteors: [],
      particles: []
    };

    bestEl.textContent = state.best;

    function spawnStar() {
      state.stars.push({
        x: 20 + Math.random() * (canvas.width - 40),
        y: -12,
        size: 7 + Math.random() * 6,
        vy: state.speed + Math.random() * 1.4
      });
    }

    function spawnMeteor() {
      state.meteors.push({
        x: 20 + Math.random() * (canvas.width - 40),
        y: -20,
        size: 12 + Math.random() * 8,
        vy: state.speed + 0.6 + Math.random() * 1.7,
        wobble: Math.random() * Math.PI * 2
      });
    }

    function burst(x, y, color, count = 10) {
      for (let i = 0; i < count; i += 1) {
        const angle = Math.random() * Math.PI * 2;
        const force = 1 + Math.random() * 3;
        state.particles.push({
          x,
          y,
          vx: Math.cos(angle) * force,
          vy: Math.sin(angle) * force,
          life: 30 + Math.random() * 18,
          color
        });
      }
    }

    function drawShip() {
      const x = state.playerX;
      const y = canvas.height - 36;
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = "#77f2ff";
      ctx.beginPath();
      ctx.moveTo(0, -18);
      ctx.lineTo(15, 12);
      ctx.lineTo(0, 5);
      ctx.lineTo(-15, 12);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(-3, -3, 6, 8);
      ctx.restore();
      return { x, y, r: 16 };
    }

    function drawStar(item) {
      ctx.save();
      ctx.translate(item.x, item.y);
      ctx.fillStyle = "#ffe082";
      ctx.beginPath();
      for (let i = 0; i < 10; i += 1) {
        const angle = (Math.PI / 5) * i;
        const radius = i % 2 === 0 ? item.size : item.size * 0.45;
        ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawMeteor(item) {
      ctx.save();
      ctx.translate(item.x + Math.sin(item.wobble) * 8, item.y);
      ctx.fillStyle = "#ff5f7e";
      ctx.beginPath();
      ctx.arc(0, 0, item.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function distance(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function update() {
      if (!state.running) {
        return;
      }

      state.spawnTimer += 1;
      if (state.spawnTimer % 28 === 0) {
        spawnStar();
      }
      if (state.spawnTimer % 46 === 0) {
        spawnMeteor();
      }
      if (state.spawnTimer % 220 === 0) {
        state.speed += 0.25;
      }

      for (const item of state.stars) {
        item.y += item.vy;
      }
      for (const item of state.meteors) {
        item.y += item.vy;
        item.wobble += 0.06;
      }
      for (const particle of state.particles) {
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.vy += 0.04;
        particle.life -= 1;
      }

      state.stars = state.stars.filter((item) => item.y < canvas.height + 40);
      state.meteors = state.meteors.filter((item) => item.y < canvas.height + 50);
      state.particles = state.particles.filter((particle) => particle.life > 0);

      const player = { x: state.playerX, y: canvas.height - 36, r: 16 };

      state.stars = state.stars.filter((item) => {
        const hit = distance(player, item) < player.r + item.size;
        if (hit) {
          state.score += 10;
          burst(item.x, item.y, "#ffe082", 12);
          return false;
        }
        return true;
      });

      state.meteors = state.meteors.filter((item) => {
        const shifted = { x: item.x + Math.sin(item.wobble) * 8, y: item.y };
        const hit = distance(player, shifted) < player.r + item.size;
        if (hit) {
          state.lives -= 1;
          burst(shifted.x, shifted.y, "#ff5f7e", 16);
          if (state.lives <= 0) {
            state.running = false;
            if (state.score > state.best) {
              state.best = state.score;
              localStorage.setItem("starCatcherBest", String(state.best));
            }
          }
          return false;
        }
        return true;
      });
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < 45; i += 1) {
        const x = (i * 137) % canvas.width;
        const y = ((i * 97) + state.spawnTimer * 0.4) % canvas.height;
        ctx.fillStyle = "rgba(255,255,255,0.25)";
        ctx.fillRect(x, y, 2, 2);
      }
    }

    function drawParticles() {
      for (const particle of state.particles) {
        ctx.globalAlpha = Math.max(particle.life / 48, 0);
        ctx.fillStyle = particle.color;
        ctx.fillRect(particle.x, particle.y, 3, 3);
      }
      ctx.globalAlpha = 1;
    }

    function drawOverlay() {
      if (state.running) {
        return;
      }
      ctx.fillStyle = "rgba(6, 8, 18, 0.7)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = "center";
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 46px Segoe UI";
      ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 20);
      ctx.font = "22px Segoe UI";
      ctx.fillText(`Final Score: ${state.score}`, canvas.width / 2, canvas.height / 2 + 25);
      ctx.fillStyle = "#77f2ff";
      ctx.fillText("Press Restart to play again", canvas.width / 2, canvas.height / 2 + 65);
    }

    function render() {
      drawBackground();
      drawShip();
      state.stars.forEach(drawStar);
      state.meteors.forEach(drawMeteor);
      drawParticles();
      drawOverlay();

      scoreEl.textContent = state.score;
      livesEl.textContent = Math.max(state.lives, 0);
      bestEl.textContent = state.best;
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    function reset() {
      state.score = 0;
      state.lives = 3;
      state.running = true;
      state.spawnTimer = 0;
      state.speed = 2.2;
      state.stars = [];
      state.meteors = [];
      state.particles = [];
    }

    function updatePointer(clientX) {
      const rect = canvas.getBoundingClientRect();
      const scale = canvas.width / rect.width;
      const x = (clientX - rect.left) * scale;
      state.playerX = Math.min(canvas.width - 20, Math.max(20, x));
    }

    canvas.addEventListener("mousemove", (event) => updatePointer(event.clientX));
    canvas.addEventListener("touchmove", (event) => {
      if (event.touches[0]) {
        updatePointer(event.touches[0].clientX);
      }
    }, { passive: true });

    restartBtn.addEventListener("click", reset);

    reset();
    loop();
  </script>
</body>
</html>
